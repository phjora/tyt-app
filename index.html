<style>
:root{--accent:#0B4EA2;--accent-text:#0B4EA2;--bg:#F3F5F7;--card:#FFFFFF;--text:#141A21;--muted:#56616D;--line:#DDE2E7;--tint:#E8EEF5}
:root.dark{--bg:#0F1318;--card:#1A2028;--text:#F2F4F6;--muted:#A9B3BD;--line:#2C3540;--tint:#27303B;--accent-text:#9CC4F5}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:inherit}
button{cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{background:var(--accent);color:#fff;padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top))}
header .row{display:flex;justify-content:space-between;align-items:baseline}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:1px}
header .sub{font-size:13px;margin-top:4px}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:96px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .inner{max-width:520px;margin:0 auto;display:flex;padding:6px}
nav button{flex:1;min-height:48px;border:none;border-top:3px solid transparent;background:transparent;color:var(--muted);font-weight:500;font-size:12px}

h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0}
.muted{color:var(--muted)}.small{font-size:12px}.s13{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.todo{border-color:var(--accent-text)}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{min-height:44px;padding:0 14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px}
.pager button{width:44px;height:44px;border:none;border-radius:12px;background:var(--tint);color:var(--text);font-size:22px}
.pager button:disabled{color:var(--muted);opacity:.5}
.pager .mid{text-align:center}.pager .mid b{font-size:15px}
.teams{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px}
.teams>div{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.teams>div:last-child{justify-content:flex-end;text-align:right}
.crest{width:32px;height:32px;flex-shrink:0;object-fit:contain}
.crest.sm{width:22px;height:22px}
.stepper{display:flex;justify-content:center;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border:none;border-radius:12px;background:var(--tint);color:var(--text);font-size:22px}
.num{width:30px;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px}
.colon{width:14px;text-align:center;font-weight:700;font-size:22px;color:var(--muted)}
.result{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;text-align:center}
.tag{font-weight:600;color:var(--accent-text)}
.list{background:var(--tint);border-radius:12px;padding:4px 12px}
.list>div{display:flex;gap:8px;padding:8px 0;font-size:13px}
.list>div>:first-child{flex:1}
.scroll{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:600;vertical-align:bottom}
th b{display:block;font-size:13px;color:var(--text)}
.stick{position:sticky;left:0;background:var(--card);text-align:left;border-right:1px solid var(--line);min-width:132px}
tr.me td{background:var(--tint)}
.who{display:flex;align-items:center;gap:6px;font-weight:600}
.who .name{flex:1;overflow:hidden;text-overflow:ellipsis;max-width:74px}
.who .tot{text-align:right}
.who .tot b{font-family:'Space Grotesk',sans-serif;font-size:18px;display:block}
.pts{display:inline-block;min-width:22px;padding:1px 0;border-radius:6px;font-size:11px;font-weight:700;color:var(--muted)}
.pts.p2,.pts.p3{background:var(--tint);color:var(--text)}
tr.me .pts.p2,tr.me .pts.p3{background:var(--card)}
.pts.p4{background:var(--accent);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--text);font-weight:600;font-size:14px}
.pills button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
input[type=email],input[type=password],input[type=text]{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);color:var(--text);font-size:16px}
.msg{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--tint)}
.link{background:none;border:none;color:var(--accent-text);font-weight:600;font-size:14px;min-height:44px;text-align:left;padding:0}
.own td{font-weight:700;background:var(--tint)}
.left{text-align:left}
table.lt{table-layout:fixed}
table.lt td.nm,table.lt th.nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.lt td.cr{padding:4px 0}
th .crest{display:block;margin:0 auto 2px}
td.z-up{box-shadow:inset 5px 0 0 #1B7F3B}td.z-upq{box-shadow:inset 5px 0 0 #8FD3A6}
td.z-downq{box-shadow:inset 5px 0 0 #F2B26B}td.z-down{box-shadow:inset 5px 0 0 #B3261E}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.l2{height:18px;margin-top:3px;display:flex;justify-content:center;align-items:center;gap:3px;font-size:12px;line-height:1}
.joker{min-width:72px;padding:0 8px;height:44px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.joker.on{background:var(--accent);border-color:var(--accent);color:#fff}
.joker:disabled{opacity:.4}
.bar{height:8px;border-radius:4px;background:var(--tint)}.bar>div{height:8px;border-radius:4px;background:var(--accent)}
.statrow{display:flex;flex-direction:column;gap:4px}.statrow .between{font-size:13px;font-weight:500}
nav button{font-size:11px}
.mini{max-height:264px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.mini table{font-size:12px}.mini td,.mini th{padding:6px 6px}
.mini tr.own td{background:var(--accent);color:#fff;font-weight:700}
.mini tr.opp td{background:var(--tint);font-weight:700;box-shadow:inset 0 2px 0 var(--accent-text),inset 0 -2px 0 var(--accent-text)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://gglktzmglclnaqtuztnf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_t5yL-_iDGq47tCqaJDbdSw_KM85kRuI';
const TZ = 'Europe/Berlin';
const hashAtLoad = location.hash;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const S = { tab: 'tipp', needPassword: /type=(invite|recovery)/.test(hashAtLoad), authMsg: '', open: {}, saving: {} };

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
if (store.get('tyt-dark') === '1') document.documentElement.classList.add('dark');

// ---------- Hilfen ----------
function points(th, tg, rh, rg) {
  if (th === rh && tg === rg) return 4;
  if (rh === rg) return th === tg ? 2 : 0;
  if (th - tg === rh - rg) return 3;
  return Math.sign(th - tg) === Math.sign(rh - rg) ? 2 : 0;
}
const berlinDay = (iso) => new Date(iso).toLocaleDateString('sv-SE', { timeZone: TZ });
function weekKey(iso) {
  const [y, m, d] = berlinDay(iso).split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() - ((dt.getUTCDay() + 6) % 7));
  return dt.toISOString().slice(0, 10);
}
function weekLabel(key) {
  const [y, m, d] = key.split('-').map(Number);
  const f = (off) => { const x = new Date(Date.UTC(y, m - 1, d + off)); return String(x.getUTCDate()).padStart(2, '0') + '.' + String(x.getUTCMonth() + 1).padStart(2, '0') + '.'; };
  return f(0) + ' – ' + f(6) + y;
}
const when = (iso) => new Date(iso).toLocaleString('de-DE', { timeZone: TZ, weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(',', '').replace(/, /, ' · ');
const started = (m) => new Date(m.kickoff) <= new Date();
const isFinal = (m) => m.result_final && !m.void && m.home_goals != null && m.guest_goals != null;
function crest(clubId, cls) {
  const url = S.logos[clubId];
  return url ? `<img class="crest ${cls || ''}" src="${esc(url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="crest ${cls || ''}"></span>`;
}
function applyClubColor() {
  const c = S.club && S.club.color_primary;
  if (c) {
    document.documentElement.style.setProperty('--accent', c);
    if (!document.documentElement.classList.contains('dark')) document.documentElement.style.setProperty('--accent-text', c);
    else document.documentElement.style.removeProperty('--accent-text');
    const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.content = c;
  }
}

// ---------- Daten ----------
async function loadAll() {
  const uid = S.session.user.id;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  S.profile = profile;
  if (!profile || !profile.club_id) return;
  const [club, teams, matches, logos, tips, profiles, tables, pteams, questions, answers, push] = await Promise.all([
    sb.from('clubs').select('*').eq('id', profile.club_id).maybeSingle(),
    sb.from('teams').select('*').order('sort_order'),
    sb.from('matches').select('*').eq('counts', true).order('kickoff').limit(2000),
    sb.from('bfv_clubs').select('bfv_club_id,logo_url').limit(2000),
    sb.from('tips').select('*').limit(20000),
    sb.from('profiles').select('id,display_name'),
    sb.from('league_tables').select('*').order('position').limit(5000),
    sb.from('profile_teams').select('*').limit(5000),
    sb.from('bonus_questions').select('*').order('deadline').limit(2000),
    sb.from('bonus_answers').select('*').limit(20000),
    sb.from('push_settings').select('*').eq('profile_id', uid).maybeSingle(),
  ]);
  const err = [club, teams, matches, logos, tips, profiles, tables, pteams, questions, answers].find((r) => r.error);
  if (err) { S.loadError = err.error.message; return; }
  S.club = club.data;
  S.teams = Object.fromEntries(teams.data.map((t) => [t.id, t]));
  S.teamList = teams.data.filter((t) => t.counts);
  S.matches = matches.data.filter((m) => S.teams[m.team_id] && S.teams[m.team_id].counts);
  S.logos = Object.fromEntries(logos.data.map((l) => [l.bfv_club_id, l.logo_url]));
  S.tips = tips.data;
  S.profiles = profiles.data;
  S.tables = tables.data;
  S.pteams = pteams.data;
  S.questions = questions.data;
  S.answers = answers.data;
  S.push = push.error ? null : push.data;
  S.clubByName = {};
  for (const m of matches.data) { if (m.home_bfv_club_id) S.clubByName[m.home_name] = m.home_bfv_club_id; if (m.guest_bfv_club_id) S.clubByName[m.guest_name] = m.guest_bfv_club_id; }
  S.weeks = [...new Set(S.matches.map((m) => weekKey(m.kickoff)))].sort();
  const now = new Date();
  const next = S.matches.find((m) => new Date(m.kickoff) > now);
  S.currentWeek = next ? S.weeks.indexOf(weekKey(next.kickoff)) : S.weeks.length - 1;
  S.tipWeek = S.currentWeek;
  const lastStarted = [...S.matches].reverse().find((m) => new Date(m.kickoff) <= now);
  S.rankWeek = lastStarted ? S.weeks.indexOf(weekKey(lastStarted.kickoff)) : S.currentWeek;
  const tippedIn = (i) => { const ids = new Set(weekMatches(i).map((m) => m.id)); return S.tips.some((t) => ids.has(t.match_id)); };
  if (!tippedIn(S.rankWeek)) S.rankWeek = S.currentWeek;
  S.liga = S.teamList[0] && S.teamList[0].id;
  applyClubColor();
}
const tipPts = (t, m) => points(t.home_goals, t.guest_goals, m.home_goals, m.guest_goals) * (t.joker ? 2 : 1);
const teamsOf = (pid) => S.pteams.filter((x) => x.profile_id === pid).map((x) => x.team_id);
const isMine = (m) => teamsOf(S.session.user.id).includes(m.team_id);
const isWeekend = (iso) => { const [y, mo, d] = berlinDay(iso).split('-').map(Number); return [5, 6, 0].includes(new Date(Date.UTC(y, mo - 1, d)).getUTCDay()); };
const weekendMatches = (wk) => S.matches.filter((m) => weekKey(m.kickoff) === wk && isWeekend(m.kickoff) && !m.void);
function tippedWins(pid, wk) {
  const ids = new Set(weekendMatches(wk).map((m) => m.id)); const byId = Object.fromEntries(S.matches.map((m) => [m.id, m]));
  return S.tips.filter((t) => t.profile_id === pid && ids.has(t.match_id) && (t.home_goals - t.guest_goals) * (byId[t.match_id].is_home ? 1 : -1) > 0).length;
}
function tippedTop(pid, wk, dir) {
  // Mannschaft(en) mit dem höchsten getippten Sieg (dir = 1) bzw. der höchsten getippten Niederlage (dir = -1)
  const byId = Object.fromEntries(weekendMatches(wk).map((m) => [m.id, m]));
  let best = 0, teams = [];
  for (const t of S.tips) {
    const m = byId[t.match_id];
    if (!m || t.profile_id !== pid) continue;
    const mg = (t.home_goals - t.guest_goals) * (m.is_home ? 1 : -1) * dir;
    if (mg > best) { best = mg; teams = [m.team_id]; } else if (mg === best && mg > 0 && !teams.includes(m.team_id)) teams.push(m.team_id);
  }
  return { teams, margin: best };
}
const topLabel = (x) => x.teams.length ? x.teams.map((id) => (S.teams[id] || {}).label).join(', ') + ' (' + x.margin + (x.margin === 1 ? ' Tor' : ' Tore') + ')' : 'keine';
const weekQuestions = (wk) => S.questions.filter((q) => q.scope === 'matchday' && q.matchday === wk);
function bonusPts(q, pid) {
  if (!q.resolved) return 0;
  if (q.kind === 'matchday_wins') return q.correct_number != null && tippedWins(pid, q.matchday) === Number(q.correct_number) ? q.points : 0;
  if (q.kind === 'biggest_win' || q.kind === 'biggest_loss') {
    // Richtig, wenn alle selbst getippten Spitzen-Mannschaften auch tatsächlich vorne liegen
    const mine = tippedTop(pid, q.matchday, q.kind === 'biggest_win' ? 1 : -1).teams, real = q.correct_team_ids || [];
    return (mine.length ? mine.every((id) => real.includes(id)) : real.length === 0) ? q.points : 0;
  }
  return answerPts(q, answerOf(q.id, pid));
}
const answerOf = (qid, pid) => S.answers.find((a) => a.question_id === qid && a.profile_id === pid);
const qClosed = (q) => new Date(q.deadline) <= new Date();
function answerPts(q, a) {
  if (!q.resolved || !a) return 0;
  if (q.answer_type === 'team') return a.team_id && ((q.correct_team_ids || []).includes(a.team_id) || a.team_id === q.correct_team_id) ? q.points : 0;
  return a.number != null && q.correct_number != null && Number(a.number) === Number(q.correct_number) ? q.points : 0;
}
async function saveAnswer(q, values) {
  const uid = S.session.user.id;
  let a = answerOf(q.id, uid), res;
  if (a) { Object.assign(a, values); res = await sb.from('bonus_answers').update(values).eq('id', a.id); }
  else {
    res = await sb.from('bonus_answers').insert(Object.assign({ question_id: q.id, profile_id: uid }, values)).select().single();
    if (!res.error) S.answers.push(res.data);
  }
  S.bonusMsg = res.error ? 'Speichern hat nicht geklappt.' : '';
  render();
}
async function toggleJoker(matchId) {
  const t = myTip(matchId); const byId = Object.fromEntries(S.matches.map((m) => [m.id, m])); const m = byId[matchId];
  if (!t || t._new) return;
  S.jokerMsg = '';
  if (t.joker) { t.joker = false; await sb.from('tips').update({ joker: false }).eq('id', t.id); render(); return; }
  const other = S.tips.find((x) => x.profile_id === t.profile_id && x.joker && byId[x.match_id] && weekKey(byId[x.match_id].kickoff) === weekKey(m.kickoff));
  if (other) {
    if (started(byId[other.match_id])) { S.jokerMsg = 'Dein Joker für diesen Spieltag ist schon verbraucht.'; render(); return; }
    other.joker = false; await sb.from('tips').update({ joker: false }).eq('id', other.id);
  }
  const res = await sb.from('tips').update({ joker: true }).eq('id', t.id);
  if (res.error) S.jokerMsg = 'Dein Joker für diesen Spieltag ist schon verbraucht.'; else t.joker = true;
  render();
}
const myTip = (matchId) => S.tips.find((t) => t.match_id === matchId && t.profile_id === S.session.user.id);
const weekMatches = (i) => S.matches.filter((m) => weekKey(m.kickoff) === S.weeks[i]);

const timers = {};
function changeTip(matchId, side, delta) {
  let t = myTip(matchId);
  if (!t) { t = { match_id: matchId, profile_id: S.session.user.id, home_goals: 0, guest_goals: 0, _new: true }; t[side] = Math.max(0, delta); S.tips.push(t); }
  else t[side] = Math.max(0, Math.min(20, t[side] + delta));
  S.saving[matchId] = 'offen';
  patchTip(matchId);
  clearTimeout(timers[matchId]);
  timers[matchId] = setTimeout(() => saveTip(matchId), 700);
}
async function saveTip(matchId) {
  const t = myTip(matchId);
  if (!t) return;
  let res;
  if (t._new) {
    res = await sb.from('tips').insert({ match_id: t.match_id, profile_id: t.profile_id, home_goals: t.home_goals, guest_goals: t.guest_goals }).select().single();
    if (!res.error) { t.id = res.data.id; delete t._new; }
  } else {
    res = await sb.from('tips').update({ home_goals: t.home_goals, guest_goals: t.guest_goals }).eq('id', t.id).select().single();
  }
  S.saving[matchId] = res.error ? 'fehler' : 'ok';
  if (res.error) console.error(res.error);
  patchTip(matchId);
}
async function quickTip() {
  const todo = weekMatches(S.tipWeek).filter((m) => !started(m) && !m.void && !myTip(m.id));
  for (const m of todo) {
    S.tips.push({ match_id: m.id, profile_id: S.session.user.id, home_goals: m.is_home ? 2 : 1, guest_goals: m.is_home ? 1 : 2, _new: true });
    S.saving[m.id] = 'offen';
  }
  render();
  for (const m of todo) await saveTip(m.id);
}

// ---------- Ansichten ----------
function pager(idx, name, current) {
  const key = S.weeks[idx];
  return `<div class="pager">
    <button data-act="${name}-prev" aria-label="Vorheriger Spieltag" ${idx <= 0 ? 'disabled' : ''}>‹</button>
    <div class="mid"><b>Spieltag ${idx + 1}${idx === current ? ' · aktuell' : ''}</b><div class="small muted">${weekLabel(key)}</div></div>
    <button data-act="${name}-next" aria-label="Nächster Spieltag" ${idx >= S.weeks.length - 1 ? 'disabled' : ''}>›</button>
  </div>`;
}
function matchHead(m) {
  const team = S.teams[m.team_id];
  const t = myTip(m.id);
  const jk = !started(m) && !m.void ? `<button class="joker ${t && t.joker ? 'on' : ''}" data-act="joker" data-id="${m.id}" ${t && !t._new ? '' : 'disabled'} aria-label="Joker: Punkte zählen doppelt">🃏 2x</button>`
    : (t && t.joker ? '<span class="joker on" style="display:flex;align-items:center;justify-content:center">🃏 2x</span>' : '');

function viewStats() {
  const byId = Object.fromEntries(S.matches.map((m) => [m.id, m]));
  const st = Object.fromEntries(S.profiles.map((p) => [p.id, { name: p.display_name, own: 0, against: 0, all: 0, clubWin: 0, ownPts: 0, ownN: 0, othPts: 0, othN: 0, pts: 0, swarm: 0 }]));
  const perMatch = {};
  for (const t of S.tips) {
    const m = byId[t.match_id], s = st[t.profile_id];
    if (!m || !s || !started(m) || m.void) continue;
    const diff = (t.home_goals - t.guest_goals) * (m.is_home ? 1 : -1);
    const mine = teamsOf(t.profile_id).includes(m.team_id);
    s.all++; if (diff > 0) s.clubWin++;
    if (mine) { s.own++; if (diff < 0) s.against++; }
    if (isFinal(m)) {
      const p = points(t.home_goals, t.guest_goals, m.home_goals, m.guest_goals);
      if (mine) { s.ownPts += p; s.ownN++; } else { s.othPts += p; s.othN++; }
      (perMatch[m.id] = perMatch[m.id] || []).push({ pid: t.profile_id, t, p });
    }
  }

  const hint = teamsOf(S.session.user.id).length ? '' : '<div class="msg">Trag unter „Mehr“ deine Mannschaften ein, dann tauchst du auch bei Verräter-Quote und Selbsterkenntnis auf.</div>';
  return `<div><h1>Statistiken</h1><div class="s13 muted">Wer tippt wie? Gezählt werden angepfiffene Spiele.</div></div>${hint}` +

function standings(uptoWeek) {
  const limit = S.weeks[uptoWeek];
  const byId = Object.fromEntries(S.matches.map((m) => [m.id, m]));
  const rows = S.profiles.map((p) => ({ id: p.id, name: p.display_name, total: 0, day: 0 }));
  const idx = Object.fromEntries(rows.map((r) => [r.id, r]));
  for (const t of S.tips) {
    const m = byId[t.match_id]; const r = idx[t.profile_id];
    if (!m || !r || !isFinal(m)) continue;
    const wk = weekKey(m.kickoff);
    if (wk > limit) continue;
    const p = tipPts(t, m);
    r.total += p; if (wk === limit) r.day += p;
  }
  for (const q of S.questions) {
    if (!q.resolved || q.scope !== 'matchday') continue;
    const wk = q.scope === 'matchday' ? q.matchday : weekKey(q.deadline);
    if (wk > limit) continue;
    for (const r of rows) { const p = q.scope === 'matchday' ? bonusPts(q, r.id) : answerPts(q, answerOf(q.id, r.id)); r.total += p; if (wk === limit) r.day += p; }
  }
  rows.sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  return rows;
}

function viewSettings() {
  const dark = document.documentElement.classList.contains('dark');
  return `<div><h1>Einstellungen</h1><div class="s13 muted">${esc(S.session.user.email)}</div></div>
    <div class="card"><label>Anzeigename<input type="text" id="dn" maxlength="24" value="${esc(S.profile.display_name)}"></label>
      <button class="btn" data-act="save-name">Namen speichern</button>${S.nameMsg ? `<div class="msg">${esc(S.nameMsg)}</div>` : ''}</div>
    <div class="card"><b>Deine Mannschaften</b><div class="small muted">Für „dein Team“ und die Statistiken. Mehrere möglich.</div>
      <div class="pills">${S.teamList.map((t) => `<button data-act="myteam" data-id="${t.id}" class="${teamsOf(S.session.user.id).includes(t.id) ? 'on' : ''}">${esc(t.label)}</button>`).join('')}</div></div>
    <div class="card"><div class="between"><b>Erinnerung per Push</b><button class="btn" data-act="push">${S.push && S.push.enabled ? 'An' : 'Aus'}</button></div>
      <div class="small muted">Freitagabend und kurz vor dem ersten Anpfiff, falls du noch offene Tipps hast.</div>
      ${S.push && S.push.enabled ? `<div class="msg">So kommt die Erinnerung aufs Handy:<br>1. Die kostenlose App „ntfy“ installieren.<br>2. Dort dieses Thema abonnieren: <b style="word-break:break-all">${esc(S.push.topic)}</b><br><a href="https://ntfy.sh/${esc(S.push.topic)}" target="_blank" rel="noopener">Im Browser öffnen</a><br>Das Thema ist nur für dich. Wer es kennt, kann deine Erinnerungen mitlesen.</div>` : ''}</div>
    <div class="card"><div class="between"><b>Dunkles Design</b><button class="btn" data-act="dark">${dark ? 'An' : 'Aus'}</button></div></div>
    <div class="card"><div class="between"><b>Verein</b><span class="s13">${esc(S.club.name)}</span></div>
      <div class="small muted">Die Farben der App richten sich nach dem Vereinswappen.</div></div>
    <button class="btn ghost" data-act="logout">Abmelden</button>`;
}
const nameMissing = () => S.profile && S.session && S.profile.display_name === (S.session.user.email || '').split('@')[0];
function nameCard() {
  return `<div class="card todo"><b>Wie sollen dich die anderen sehen?</b>
    <div class="s13 muted">Im Moment steht dort „${esc(S.profile.display_name)}“. Du kannst den Namen jederzeit unter „Mehr“ ändern.</div>
    <label>Dein Name im Tippspiel<input type="text" id="dn" maxlength="24" autocomplete="nickname"></label>
    <button class="btn" data-act="save-name">Namen speichern</button></div>`;
}
function viewAuth() {
  if (S.session && S.needPassword) {
    return `<div><h1>Passwort festlegen</h1><div class="s13 muted">Damit meldest du dich künftig an.</div></div>
      <form class="card" data-form="setpw"><label>Dein Name im Tippspiel (so sehen dich die anderen)<input type="text" name="dn" maxlength="24" autocomplete="nickname" required></label><label>Neues Passwort (mindestens 8 Zeichen)<input type="password" name="pw" minlength="8" autocomplete="new-password" required></label>
      <button class="btn" type="submit">Speichern</button>${S.authMsg ? `<div class="msg">${esc(S.authMsg)}</div>` : ''}</form>`;
  }
  return `<div><h1>Anmelden</h1><div class="s13 muted">Das Tippspiel für deinen Verein. Zugang nur mit Einladung.</div></div>
    <form class="card" data-form="login">
      <label>E-Mail<input type="email" name="email" autocomplete="email" required></label>
      <label>Passwort<input type="password" name="pw" autocomplete="current-password"></label>
      <button class="btn" type="submit">Anmelden</button>
      <button class="link" type="button" data-act="reset">Passwort vergessen? Link per E-Mail schicken</button>
      ${S.authMsg ? `<div class="msg">${esc(S.authMsg)}</div>` : ''}
    </form>`;
}
function morph(from, to) {
  if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) { from.replaceWith(to); return; }
  if (from.nodeType === 3) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
  if (from.nodeType !== 1) return;
  const oldValue = from.getAttribute('value');
  for (const a of [...from.attributes]) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
  for (const a of [...to.attributes]) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  if (from.nodeName === 'INPUT' && to.hasAttribute('value') && oldValue !== to.getAttribute('value')) from.value = to.getAttribute('value');
  const a = [...from.childNodes], b = [...to.childNodes];
  for (let i = 0; i < b.length; i++) { if (a[i]) morph(a[i], b[i]); else from.appendChild(b[i]); }
  for (let i = b.length; i < a.length; i++) a[i].remove();
}
function render() {
  const keepScroll = window.scrollY;
  const authed = S.session && !S.needPassword;
  let body;
  if (!S.ready) body = '<div class="msg">Lädt …</div>';
  else if (!authed) body = viewAuth();
  else if (S.loadError) body = `<div class="msg">Daten konnten nicht geladen werden: ${esc(S.loadError)}</div>`;
  else if (!S.profile || !S.profile.club_id) body = '<div class="msg">Dein Konto ist noch keinem Verein zugeordnet. Melde dich bei deinem Vereins-Admin.</div><button class="btn ghost" data-act="logout">Abmelden</button>';
  else body = (nameMissing() && S.tab !== 'set' ? nameCard() : '') + { tipp: viewTipp, rank: viewRank, bonus: viewBonus, stats: viewStats, liga: viewLiga, set: viewSettings }[S.tab]();
  const showNav = authed && S.profile && S.profile.club_id && !S.loadError;
  const tabs = [['tipp', 'Tippen'], ['rank', 'Tabelle'], ['liga', 'Ligen'], ['stats', 'Statistik'], ['set', 'Mehr']];  // Saisonfragen (Reiter 'bonus') sind vorerst ausgeblendet
  const next = document.createElement('div');
  next.innerHTML = `<header><div class="row"><span class="logo">TYT</span><span class="s13">Tip Your Team</span></div><div class="sub">${esc(S.club ? S.club.name : 'Tippspiel für Vereine')}</div></header>
    <main>${body}</main>` + (showNav ? `<nav><div class="inner">${tabs.map((t) => `<button data-act="tab" data-id="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</div></nav>` : '');
  morph(app, Object.assign(next, { id: 'app' }));
  window.scrollTo(0, keepScroll);
}

// ---------- Ereignisse ----------
app.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'tab') { S.tab = id; render(); window.scrollTo(0, 0); }
  else if (a === 'tip') changeTip(id, b.dataset.side, Number(b.dataset.d));
  else if (a === 'quick') quickTip();
  else if (a === 'joker') toggleJoker(id);
  else if (a === 'push') {
    const uid = S.session.user.id; let r;
    if (!S.push) r = await sb.from('push_settings').insert({ profile_id: uid, enabled: true }).select().single();
    else r = await sb.from('push_settings').update({ enabled: !S.push.enabled }).eq('profile_id', uid).select().single();
    if (!r.error) S.push = r.data;
    render();
  }
  else if (a === 'mini') { S.mini = S.mini || {}; S.mini[id] = !S.mini[id]; render(); }
  else if (a === 'ans-num') {
    const q = S.questions.find((x) => x.id === id), cur = answerOf(id, S.session.user.id);
    const n = cur && cur.number != null ? Math.max(0, Math.min(99, Number(cur.number) + Number(b.dataset.d))) : (q.kind === 'final_position' ? 1 : 0);
    saveAnswer(q, { number: n });
  }
  else if (a === 'ans-team') saveAnswer(S.questions.find((x) => x.id === id), { team_id: b.dataset.team });
  else if (a === 'myteam') {
    const uid = S.session.user.id, has = S.pteams.find((x) => x.profile_id === uid && x.team_id === id);
    if (has) { const r = await sb.from('profile_teams').delete().eq('profile_id', uid).eq('team_id', id); if (!r.error) S.pteams = S.pteams.filter((x) => x !== has); }
    else { const r = await sb.from('profile_teams').insert({ profile_id: uid, team_id: id }); if (!r.error) S.pteams.push({ profile_id: uid, team_id: id }); }
    render();
  }
  else if (a === 'all') { S.open[id] = !S.open[id]; render(); }
  else if (a === 'tip-prev') { S.tipWeek--; render(); }
  else if (a === 'tip-next') { S.tipWeek++; render(); }
  else if (a === 'rank-prev') { S.rankWeek--; render(); }
  else if (a === 'rank-next') { S.rankWeek++; render(); }
  else if (a === 'liga') { S.liga = id; render(); }
  else if (a === 'dark') { const on = document.documentElement.classList.toggle('dark'); store.set('tyt-dark', on ? '1' : '0'); applyClubColor(); render(); }
  else if (a === 'logout') { await sb.auth.signOut(); }
  else if (a === 'save-name') {
    const v = document.getElementById('dn').value.trim();
    if (!v) return;
    const { error } = await sb.from('profiles').update({ display_name: v }).eq('id', S.session.user.id);
    if (!error) { S.profile.display_name = v; const p = S.profiles.find((x) => x.id === S.session.user.id); if (p) p.display_name = v; }
    S.nameMsg = error ? 'Speichern hat nicht geklappt.' : 'Gespeichert.'; render();
  }
  else if (a === 'reset') {
    const email = app.querySelector('input[name=email]').value.trim();
    if (!email) { S.authMsg = 'Trag zuerst deine E-Mail-Adresse ein.'; render(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    S.authMsg = error ? 'Das hat nicht geklappt: ' + error.message : 'Falls es ein Konto mit dieser Adresse gibt, ist eine E-Mail mit Link unterwegs.'; render();
  }
});
app.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, fd = new FormData(f);
  if (kind === 'login') {
    const { error } = await sb.auth.signInWithPassword({ email: fd.get('email').trim(), password: fd.get('pw') });
    if (error) { S.authMsg = 'Anmeldung fehlgeschlagen. Stimmen E-Mail und Passwort?'; render(); }
  } else if (kind === 'setpw') {
    const { error } = await sb.auth.updateUser({ password: fd.get('pw') });
    if (error) { S.authMsg = 'Das hat nicht geklappt: ' + error.message; render(); return; }
    S.needPassword = false; S.authMsg = ''; history.replaceState(null, '', location.pathname);
    const dn = String(fd.get('dn') || '').trim();
    if (dn) await sb.from('profiles').update({ display_name: dn }).eq('id', S.session.user.id);
    await loadAll(); render();
  }
});

let loadedFor = null;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') S.needPassword = true;
  S.session = session;
  setTimeout(async () => {
    if (session && loadedFor !== session.user.id) { loadedFor = session.user.id; S.authMsg = ''; await loadAll(); }
    if (!session) { loadedFor = null; S.profile = null; S.club = null; }
    S.ready = true; render();
  }, 0);
});
render();
</script>
</body>
</html>
